<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F6F9;color:#14212B}
a{color:#0E7C6B}a:hover{color:#0A5F52}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C5D3DD;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:#13304B;color:#fff}
.nav a.on{background:#0E7C6B;color:#fff}
button{font-family:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4D59;font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD4DB;border-radius:8px;background:#fff;color:#14212B;min-height:42px;box-sizing:border-box}
th{font-weight:600;font-size:11px;color:#5A6B78;text-align:left;padding:10px 12px;border-bottom:1px solid #E4E9EE;background:#F8FAFB;text-transform:uppercase;letter-spacing:.05em}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4}
tbody tr:hover{background:#F7FBFA}
h1{letter-spacing:-.02em}

<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E4E9EE;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;box-sizing:border-box">

    <div style="flex:1 1 220px;max-width:460px;display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:0 12px;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input aria-label="Buscar" placeholder="Buscar empresa, nota, cliente, produto…" style="border:0;background:transparent;min-height:38px;padding:0;flex:1;min-width:0;outline:none"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button aria-label="Notificações" style="position:relative;width:40px;height:40px;border-radius:9px;border:1px solid #E4E9EE;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#D97706"></span></button>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:50%;background:#0B2239;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">AN</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:13px;font-weight:600">Ana Ribeiro</span><span style="font-size:12px;color:#5A6B78">Contadora · Escritório Exemplo</span></span></div>
    </div>
  </header>
<div style="display:flex;flex-wrap:wrap;flex:1">
  <nav class="nav" style="flex:1 1 220px;max-width:248px;background:#0B2239;padding:18px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">CONTABILIDADE</div>
    <a href="Main.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Visão geral</span></a>
    <a href="Empresa.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg><span>Empresas e regime</span></a>
    <a href="Naturezas.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg><span>Naturezas e impostos</span></a>
    <a href="Documentos.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg><span>Central de documentos</span></a>
    <a class="on" href="Exportacao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 15v6h14v-6"/></svg><span>Exportação contábil</span></a>
    <a href="Pendencias.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/></svg><span>Pendências</span><span style="margin-left:auto;background:#D97706;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px">5</span></a>
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">EMPRESA ABERTA</div>
    <a href="Venda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Vendas e notas fiscais</span></a>
    <a href="Financeiro.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg><span>Financeiro</span></a>
    <a href="Integracao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg><span>Contabilidade do cliente</span></a>
    <a href="Login.html" style="margin-top:18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>
  </nav>
  <main id="dc-root" style="flex:999 1 560px;min-width:0;padding:22px 28px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"></main>
</div>
</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Contabilidade › Exportação contábil</div>

    <div>
      <h1 style="margin:0;font-size:26px">Exportação contábil</h1>
      <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Gere o arquivo de importação no layout do seu sistema contábil ou deixe o envio automático.</p>
    </div>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end">
        <label>Empresa<select><option>Marcenaria Ipê Ltda</option><option>Comercial Boa Vista Ltda</option><option>Todas as empresas</option></select></label>
        <label>Competência<select><option>Outubro/2026</option><option>Novembro/2026</option></select></label>
        <label>Layout do sistema contábil<select onChange="{{pickLayout}}"><option>Domínio</option><option>Questor</option><option>Alterdata</option><option>Contmatic</option><option>Personalizado (CSV)</option></select></label>
        <button onClick="{{gerar}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Gerar arquivo</button>
      </div>
      <template data-if="gerado">
        <div role="status" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;background:#ECF7F4;border:1px solid #BFE1D9;border-radius:10px;padding:14px">
          <div style="font-size:14px;color:#0A5F52"><strong>Arquivo pronto:</strong> 156 lançamentos e 63 XMLs · layout {{layout}} · sem erros de conta</div>
          <button style="background:#fff;border:1px solid #BFE1D9;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Baixar ZIP</button>
        </div>
      </template>
    </section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <div><h2 style="margin:0;font-size:16px">De-para do plano de contas</h2><p style="margin:4px 0 0;font-size:13px;color:#5A6B78">Cada categoria do cliente vai para uma conta contábil. Configure uma vez.</p></div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:420px">
            <thead><tr><th>Categoria do cliente</th><th>Conta contábil</th></tr></thead>
            <tbody>
              <tr><td>Vendas de mercadoria</td><td><input value="3.1.1.01 · Receita de vendas" aria-label="Conta para vendas" style="width:100%"></td></tr>
              <tr><td>Compra de matéria-prima</td><td><input value="4.1.1.02 · Custo de matéria-prima" aria-label="Conta para matéria-prima" style="width:100%"></td></tr>
              <tr><td>Tarifas bancárias</td><td><input value="4.2.3.05 · Despesas bancárias" aria-label="Conta para tarifas" style="width:100%"></td></tr>
              <tr><td>Combustível</td><td><input value="" placeholder="Escolher conta" aria-label="Conta para combustível" style="width:100%;border-color:#E0A458"></td></tr>
            </tbody>
          </table>
        </div>
        <p style="margin:0;font-size:13px;color:#8A3B08">1 categoria sem conta: os lançamentos dela ficam de fora até ser configurada.</p>
      </section>
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:16px">Envio automático</h2>
        <template data-for="autos" data-as="a">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #EEF1F4;border-radius:10px;padding:12px">
            <div><div style="font-weight:600;font-size:14px">{{a.nome}}</div><div style="font-size:12px;color:#5A6B78">{{a.desc}}</div></div>
            <button onClick="{{a.toggle}}" aria-pressed="{{a.on}}" style="{{a.style}}">{{a.txt}}</button>
          </div>
        </template>
        <h3 style="margin:6px 0 0;font-size:14px">Últimas exportações</h3>
        <div style="font-size:13px;color:#3D4D59;display:flex;flex-direction:column;gap:6px">
          <div>Setembro/2026 · Marcenaria Ipê · Domínio · 01/10 08:00 (automático)</div>
          <div>Setembro/2026 · Comercial Boa Vista · Domínio · 01/10 08:00 (automático)</div>
        </div>
      </section>
    </div>

</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { gerado: false, layout: 'Domínio', on: { pasta: true, api: false, mensal: true } }; }
  renderVals() {
    const on = this.state.on;
    const defs = [
      ['pasta', 'Pasta sincronizada do escritório', 'Google Drive, OneDrive ou servidor: os arquivos caem sozinhos'],
      ['api', 'API do sistema contábil', 'Quando o seu sistema oferecer integração direta'],
      ['mensal', 'Exportação mensal no dia 1º', 'Gera e envia o arquivo de todas as empresas às 08:00']
    ];
    const autos = defs.map((d) => ({
      nome: d[1], desc: d[2], on: on[d[0]] ? 'true' : 'false', txt: on[d[0]] ? 'Ligado' : 'Desligado',
      toggle: () => this.setState({ on: Object.assign({}, on, { [d[0]]: !on[d[0]] }) }),
      style: 'min-width:96px;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;min-height:40px;' + (on[d[0]] ? 'background:#0E7C6B;color:#fff;border:1px solid #0E7C6B' : 'background:#fff;color:#5A6B78;border:1px solid #CBD4DB')
    }));
    return {
      autos, gerado: this.state.gerado, layout: this.state.layout,
      gerar: () => this.setState({ gerado: true }),
      pickLayout: (e) => this.setState({ layout: e.target.value, gerado: false })
    };
  }
}

DC.start(Component);
</script>
</body>
</html>
