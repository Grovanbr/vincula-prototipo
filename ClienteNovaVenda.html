body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F6F9;color:#14212B}
a{color:#0E7C6B}a:hover{color:#0A5F52}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C5D3DD;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:#13304B;color:#fff}
.nav a.on{background:#0E7C6B;color:#fff}
button{font-family:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4D59;font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD4DB;border-radius:8px;background:#fff;color:#14212B;min-height:42px;box-sizing:border-box}
th{font-weight:600;font-size:11px;color:#5A6B78;text-align:left;padding:10px 12px;border-bottom:1px solid #E4E9EE;background:#F8FAFB;text-transform:uppercase;letter-spacing:.05em}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4}
tbody tr:hover{background:#F7FBFA}
h1{letter-spacing:-.02em}
</style>

</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E4E9EE;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;box-sizing:border-box">
    <a href="ClienteVenda.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B2239"><span style="width:34px;height:34px;border-radius:9px;background:#0E7C6B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></span><span style="font-weight:800;font-size:19px;letter-spacing:-.03em">Vincula</span><span style="font-size:11px;font-weight:700;color:#0A5F52;background:#E6F4F1;border-radius:6px;padding:2px 6px">ERP</span></a>
    <div style="display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:#14212B;min-height:40px;box-sizing:border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg><span >Marcenaria Ipê Ltda</span></div>
    <div style="flex:1 1 220px;max-width:460px;display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:0 12px;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input aria-label="Buscar" placeholder="Buscar empresa, nota, cliente, produto…" style="border:0;background:transparent;min-height:38px;padding:0;flex:1;min-width:0;outline:none"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button aria-label="Notificações" style="position:relative;width:40px;height:40px;border-radius:9px;border:1px solid #E4E9EE;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#D97706"></span></button>
      <a href="ClienteIntegracao.html" title="Minha contabilidade" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#14212B"><span  style="width:36px;height:36px;border-radius:50%;background:#0B2239;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">CM</span><span style="display:flex;flex-direction:column;line-height:1.2"><span  style="font-size:13px;font-weight:600">Carlos Mendes</span><span style="font-size:12px;color:#5A6B78">Marcenaria Ipê Ltda</span></span></a>
    </div>
  </header>
<div style="display:flex;flex-wrap:wrap;flex:1">
  <nav class="nav" style="flex:1 1 220px;max-width:248px;background:#0B2239;padding:18px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">MARCENARIA IPÊ LTDA</div>
    <a class="on" href="ClienteNovaVenda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Novo orçamento ou venda</span></a>
    <a href="ClienteVenda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Vendas e notas fiscais</span></a>
    <a href="ClienteFinanceiro.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg><span>Financeiro</span></a>
    <a href="ClienteIntegracao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg><span>Minha contabilidade</span><span style="margin-left:auto;background:#D97706;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px">1</span></a>
    <a href="LoginCliente.html" style="margin-top:18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>

  <main id="dc-root" style="flex:999 1 560px;min-width:0;padding:22px 28px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"></main>

</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Vendas › Novo orçamento ou venda</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Novo orçamento ou venda</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Monte os itens uma vez: salve como orçamento ou gere a venda direto.</p>
      </div>
      <div role="group" aria-label="Tipo" style="display:flex;background:#E9EDF0;border-radius:10px;padding:4px;gap:4px">
        <template data-for="tipos" data-as="t"><button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></template>
      </div>
    </div>
    <template data-if="editando">
    <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
      <div style="flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
          <h2 style="margin:0;font-size:16px">Cliente</h2>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
            <label>Cliente<select value="{{clienteSel}}" onChange="{{pickCliente}}"><template data-for="clientes" data-as="c"><option value="{{c.nome}}">{{c.label}}</option></template><option value="__novo">+ Cadastrar novo cliente</option></select></label>
            <label>Vendedor<select><option>Carlos (dono)</option><option>Rita</option></select></label>
            <label>Validade do orçamento<input value="10 dias"></label>
          </div>
          <template data-if="novoCli">
            <div style="border:1px dashed #0E7C6B;background:#F5FBF9;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px">
              <div style="font-weight:700;font-size:14px">Novo cliente</div>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
                <label>Nome ou razão social<input value="{{nc.nome}}" onChange="{{ncSet.nome}}" placeholder="Ex.: Maria Souza"></label>
                <label>CPF ou CNPJ<input value="{{nc.doc}}" onChange="{{ncSet.doc}}" placeholder="000.000.000-00"></label>
                <label>Cidade/UF<input value="{{nc.cidade}}" onChange="{{ncSet.cidade}}" placeholder="Pompéu/MG"></label>
                <label>Telefone / WhatsApp<input value="{{nc.fone}}" onChange="{{ncSet.fone}}" placeholder="(37) 90000-0000"></label>
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
                <button onClick="{{salvarCli}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px">Salvar cliente</button>
                <button onClick="{{cancelarCli}}" style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px;min-height:42px">Cancelar</button>
                <span style="font-size:13px;color:#A3470A">{{ncErro}}</span>
              </div>
            </div>
          </template>

        </section>
        <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
            <h2 style="margin:0;font-size:16px">Itens</h2>
            <span style="font-size:13px;color:#5A6B78">Clique em um produto ou serviço para adicionar</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <template data-for="catalogo" data-as="c">
              <button onClick="{{c.add}}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#F8FAFB;border:1px solid #E4E9EE;border-radius:10px;padding:10px 12px;min-height:44px;text-align:left">
                <span style="font-size:13px;font-weight:600;color:#14212B">+ {{c.nome}}</span><span style="font-size:12px;color:#5A6B78">{{c.precoTxt}} · {{c.tipo}}</span>
              </button>
            </template>
          </div>
          <div style="overflow-x:auto">
            <table style="width:100%;border-collapse:collapse;min-width:620px">
              <thead><tr><th>Item</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th><th></th></tr></thead>
              <tbody>
                <template data-for="itens" data-as="i">
                  <tr>
                    <td><div style="font-weight:600">{{i.nome}}</div><div style="font-size:12px;color:#5A6B78">{{i.tipo}}</div></td>
                    <td><div style="display:flex;align-items:center;gap:6px">
                      <button onClick="{{i.menos}}" aria-label="Diminuir" style="width:32px;height:32px;border-radius:8px;border:1px solid #CBD4DB;background:#fff;font-weight:700">−</button>
                      <span style="min-width:24px;text-align:center;font-weight:600">{{i.qtd}}</span>
                      <button onClick="{{i.mais}}" aria-label="Aumentar" style="width:32px;height:32px;border-radius:8px;border:1px solid #CBD4DB;background:#fff;font-weight:700">+</button>
                    </div></td>
                    <td>{{i.precoTxt}}</td>
                    <td style="font-weight:600">{{i.totalTxt}}</td>
                    <td><button onClick="{{i.tirar}}" style="background:none;border:0;color:#B42318;font-weight:600;font-size:13px;min-height:40px">Remover</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <template data-if="vazio"><p style="margin:0;font-size:14px;color:#5A6B78">Nenhum item ainda. Adicione produtos ou serviços acima.</p></template>
        </section>
        <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
          <h2 style="margin:0;font-size:16px">Pagamento e entrega</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <template data-for="pagtos" data-as="p"><button onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button></template>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
            <label>Entrega<select><option>Entrega própria</option><option>Retirada na loja</option><option>Transportadora</option></select></label>
            <label>Observações<input value="Montagem inclusa"></label>
          </div>
        </section>
      </div>
      <aside style="flex:1 1 280px;max-width:360px;background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:12px;font-size:14px">
        <h2 style="margin:0;font-size:16px">Resumo</h2>
        <div style="display:flex;justify-content:space-between"><span>Subtotal</span><strong>{{subtotalTxt}}</strong></div>
        <div style="display:flex;flex-direction:column;gap:6px"><span>Desconto</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap"><template data-for="descontos" data-as="d"><button onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button></template></div>
        </div>
        <div style="display:flex;justify-content:space-between;color:#5A6B78"><span>Desconto aplicado</span><span>− {{descontoTxt}}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:20px;border-top:1px solid #EEF1F4;padding-top:12px"><span style="font-weight:600">Total</span><strong>{{totalTxt}}</strong></div>
        <div style="font-size:13px;color:#3D4D59;background:#F8FAFB;border-radius:10px;padding:10px">{{parcelasTxt}}</div>
        <button onClick="{{salvar}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:13px;font-weight:700;font-size:15px;min-height:48px">{{botao}}</button>
        <a href="demo/Orcamento-0219.pdf" download style="text-align:center;background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:11px;font-weight:600;font-size:14px;text-decoration:none;color:#14212B">Baixar PDF de exemplo</a>
      </aside>
    </div>
    </template>
    <template data-if="salvo">
      <section role="status" style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:28px;display:flex;flex-direction:column;gap:14px;align-items:flex-start">
        <span style="background:#ECF7F4;color:#0A5F52;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700">{{okTitulo}}</span>
        <h2 style="margin:0;font-size:22px">{{okNumero}} · {{totalTxt}}</h2>
        <p style="margin:0;font-size:14px;color:#3D4D59;max-width:620px">{{okTexto}}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <a href="demo/Orcamento-0219.pdf" download style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:11px 14px;font-weight:600;font-size:14px;text-decoration:none;color:#14212B">Baixar PDF</a>
          <a href="ClienteVenda.html" style="background:#0E7C6B;color:#fff;text-decoration:none;border-radius:8px;padding:12px 14px;font-weight:600;font-size:14px">Acompanhar até a nota fiscal →</a>
          <button onClick="{{novo}}" style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:11px 14px;font-weight:600;font-size:14px;min-height:44px">Criar outro</button>
        </div>
      </section>
    </template>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:16px">Orçamentos e vendas salvos</h2>
      <template data-if="semSalvos"><p style="margin:0;font-size:14px;color:#5A6B78">Nada salvo ainda. O que você salvar aqui fica gravado neste navegador.</p></template>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:620px">
          <thead><tr><th>Número</th><th>Cliente</th><th>Itens</th><th>Pagamento</th><th>Total</th><th>Data</th></tr></thead>
          <tbody><template data-for="salvos" data-as="x"><tr><td style="font-weight:600">{{x.num}}</td><td>{{x.cliente}}</td><td>{{x.itens}}</td><td>{{x.pag}}</td><td style="font-weight:600">{{x.total}}</td><td>{{x.data}}</td></tr></template></tbody>
        </table>
      </div>
    </section>

</template>
<script src="runtime.js"></script>

    { id: 'valedosol', nome: 'Agropecuária Vale do Sol S.A.', sigla: 'VS', cnpj: '99.999.999/0001-99', regime: 'Lucro Real', cidade: 'Uberlândia', uf: 'MG', ie: '702.334455.00-88', cnae: '0151-2/01 · Criação de bovinos', notas: 87, fat: 'R$ 2.410.000,00', pend: 1, pendTxt: 'NF-e rejeitada', cert: 'Válido até 09/2027', fechado: false }
  ]; }
  empresaId() { if (true) return 'ipe'; if (this.state.__emp) return this.state.__emp; try { return localStorage.getItem('vincula_empresa') || 'ipe'; } catch (e) { return 'ipe'; } }
  empresa() { const id = this.empresaId(); return this.lista().find((x) => x.id === id) || this.lista()[0]; }
  selecionar(id) { try { localStorage.setItem('vincula_empresa', id); } catch (e) {} }
  trocarEmpresa(id) { this.selecionar(id); this.setState({ __emp: id, regime: null }); }
  renderVals() {
    try { localStorage.removeItem('vincula_modo'); } catch (x) {}
    const e = this.empresa();
    const v = this._rv();
    return Object.assign({ ctxVisivel: true, ctx: e, ctxId: e.id, ctxOpcoes: this.lista().map((x) => ({ id: x.id, label: x.nome + ' · ' + x.regime + ' · ' + x.uf })), trocar: (ev) => this.trocarEmpresa(ev.target.value) }, v);
  }

  constructor(p) {
    super(p);
    this.state = { cliente: 'Carlos Mendes', novoCli: false, nc: { nome: '', doc: '', cidade: '', fone: '' }, ncErro: '', tipo: 'orc', pag: 'entrada', desc: 5, salvo: false, itens: [{ id: 'mesa', qtd: 1 }, { id: 'cad', qtd: 6 }] };
  }
  _rv() {
    const cat = [
      { id: 'mesa', nome: 'Mesa de jantar em ipê 1,80 m', preco: 1800, tipo: 'Produto · estoque 3' },
      { id: 'cad', nome: 'Cadeira estofada em ipê', preco: 320, tipo: 'Produto · estoque 18' },
      { id: 'arm', nome: 'Armário planejado (m²)', preco: 950, tipo: 'Produto sob medida' },
      { id: 'mont', nome: 'Montagem no local', preco: 250, tipo: 'Serviço · NFS-e' },
      { id: 'frete', nome: 'Frete fora de Pompéu', preco: 120, tipo: 'Serviço' }
    ];
    const fmt = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const st = this.state;
    const clientesLista = this.db('clientes_' + this.empresa().id, [{ nome: 'Carlos Mendes', doc: 'CPF 000.000.000-00', cidade: 'Pompéu/MG' }, { nome: 'Loja Casa Bela Ltda', doc: 'CNPJ 12.345.678/0001-00', cidade: 'Pompéu/MG' }]);
    const setItens = (fn) => this.setState({ itens: fn(st.itens.map((x) => Object.assign({}, x))) });
    const catalogo = cat.map((c) => ({ ...c, precoTxt: fmt(c.preco), add: () => setItens((l) => { const e = l.find((x) => x.id === c.id); if (e) e.qtd += 1; else l.push({ id: c.id, qtd: 1 }); return l; }) }));
    let sub = 0;
    const itens = st.itens.map((it) => {
      const c = cat.find((x) => x.id === it.id); const tot = c.preco * it.qtd; sub += tot;
      return { nome: c.nome, tipo: c.tipo, qtd: it.qtd, precoTxt: fmt(c.preco), totalTxt: fmt(tot),
        mais: () => setItens((l) => { l.find((x) => x.id === it.id).qtd += 1; return l; }),
        menos: () => setItens((l) => { const e = l.find((x) => x.id === it.id); e.qtd = Math.max(1, e.qtd - 1); return l; }),
        tirar: () => setItens((l) => l.filter((x) => x.id !== it.id)) };
    });
    const dv = sub * st.desc / 100; const total = sub - dv;
    const pill = (on) => 'border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;min-height:40px;' + (on ? 'background:#0B2239;color:#fff;border:1px solid #0B2239' : 'background:#fff;color:#14212B;border:1px solid #CBD4DB');
    const pagOpts = [['vista', 'À vista (Pix)'], ['entrada', '50% entrada + 30 dias'], ['cartao', 'Cartão em até 6x'], ['boleto', 'Boleto 30/60/90']];
    const pagtos = pagOpts.map((p) => ({ label: p[1], pick: () => this.setState({ pag: p[0] }), style: pill(st.pag === p[0]) }));
    const descontos = [0, 5, 10, 15].map((d) => ({ label: d + '%', pick: () => this.setState({ desc: d }), style: pill(st.desc === d) }));
    const parc = { vista: 'Pagamento único de ' + fmt(total) + ' no Pix.', entrada: 'Entrada de ' + fmt(total / 2) + ' + ' + fmt(total / 2) + ' em 30 dias.', cartao: 'Até 6x de ' + fmt(total / 6) + ' no cartão.', boleto: '3 boletos de ' + fmt(total / 3) + ' (30, 60 e 90 dias).' }[st.pag];
    const seg = (on) => 'border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;min-height:40px;' + (on ? 'background:#fff;color:#14212B;box-shadow:0 1px 3px rgba(16,35,50,.15)' : 'background:transparent;color:#5A6B78');
    const orc = st.tipo === 'orc';
    return {
      tipos: [{ label: 'Orçamento', pick: () => this.setState({ tipo: 'orc' }), style: seg(orc) }, { label: 'Venda', pick: () => this.setState({ tipo: 'venda' }), style: seg(!orc) }],
      catalogo, itens, vazio: itens.length === 0, pagtos, descontos, parcelasTxt: parc,
      subtotalTxt: fmt(sub), descontoTxt: fmt(dv), totalTxt: fmt(total),
      botao: orc ? 'Salvar orçamento' : 'Gerar venda',
      editando: !st.salvo, salvo: st.salvo,
      okTitulo: orc ? 'Orçamento salvo' : 'Venda gerada',
      okNumero: st.ultimo || (orc ? 'Orçamento' : 'Pedido'),
      okTexto: orc ? 'PDF com a sua logo pronto para enviar. Quando o cliente aprovar, o orçamento vira venda com um clique, sem redigitar nada.' : 'Estoque reservado, contas a receber criadas conforme o pagamento e nota fiscal pronta para emitir. A contabilidade recebe tudo automaticamente.',
      salvar: () => {
        if (!itens.length) return;
        const chave = 'vendas_' + this.empresa().id;
        const ant = this.db(chave, []);
        const n = orc ? 'Orçamento nº ' + String(219 + ant.filter((x) => x.tipo === 'orc').length).padStart(4, '0') : 'Pedido nº ' + (1044 + ant.filter((x) => x.tipo !== 'orc').length);
        const reg = { tipo: st.tipo, num: n, cliente: st.cliente, itens: itens.map((i) => i.qtd + 'x ' + i.nome).join(', '), pag: pagOpts.find((p) => p[0] === st.pag)[1], total: fmt(total), data: new Date().toLocaleDateString('pt-BR') };
        this.dbSet(chave, [reg].concat(ant));
        this.setState({ salvo: true, ultimo: n });
      },
      salvos: this.db('vendas_' + this.empresa().id, []),
      semSalvos: this.db('vendas_' + this.empresa().id, []).length === 0,
      novo: () => this.setState({ salvo: false, itens: [] }),
      pickCliente: (e) => { const v = e.target.value; if (v === '__novo') this.setState({ novoCli: true, ncErro: '' }); else this.setState({ cliente: v, novoCli: false }); },
      cancelarCli: () => this.setState({ novoCli: false, nc: { nome: '', doc: '', cidade: '', fone: '' }, ncErro: '' }),
      salvarCli: () => {
        const nc = this.state.nc;
        if (!nc.nome) { this.setState({ ncErro: 'Informe o nome do cliente.' }); return; }
        const chave = 'clientes_' + this.empresa().id;
        this.dbSet(chave, clientesLista.concat([{ nome: nc.nome, doc: nc.doc ? (nc.doc.replace(/\D/g, '').length > 11 ? 'CNPJ ' : 'CPF ') + nc.doc : 'Sem documento', cidade: nc.cidade, fone: nc.fone }]));
        this.setState({ cliente: nc.nome, novoCli: false, nc: { nome: '', doc: '', cidade: '', fone: '' }, ncErro: '' });
      },
      clientes: clientesLista.map((c) => ({ nome: c.nome, label: c.nome + ' · ' + c.doc })),
      clienteSel: this.state.novoCli ? '__novo' : st.cliente,
      novoCli: this.state.novoCli, nc: this.state.nc, ncErro: this.state.ncErro,
      ncSet: { nome: (e) => this.setState({ nc: Object.assign({}, this.state.nc, { nome: e.target.value }) }), doc: (e) => this.setState({ nc: Object.assign({}, this.state.nc, { doc: e.target.value }) }), cidade: (e) => this.setState({ nc: Object.assign({}, this.state.nc, { cidade: e.target.value }) }), fone: (e) => this.setState({ nc: Object.assign({}, this.state.nc, { fone: e.target.value }) }) }
    };
  }
}

DC.start(Component);
</script>
