</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Contabilidade › Pendências</div>

    <div>
      <h1 style="margin:0;font-size:26px">Pendências e solicitações</h1>
      <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Tudo o que falta para fechar o mês de cada empresa. Peça ao cliente com um clique: o pedido aparece no app dele.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:16px"><div style="font-size:13px;color:#5A6B78">Abertas</div><div style="font-size:28px;font-weight:700;margin-top:4px;color:#A3470A">{{abertas}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:16px"><div style="font-size:13px;color:#5A6B78">Aguardando o cliente</div><div style="font-size:28px;font-weight:700;margin-top:4px">{{aguardando}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:16px"><div style="font-size:13px;color:#5A6B78">Empresas com mês fechado</div><div style="font-size:28px;font-weight:700;margin-top:4px;color:#0A5F52">3 de 6</div></div>
    </div>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
      <h2 style="margin:0;font-size:16px">Pendências do mês · Outubro/2026</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:760px">
          <thead><tr><th>Empresa</th><th>Pendência</th><th>Prioridade</th><th>Situação</th><th></th></tr></thead>
          <tbody>
            <template data-for="itens" data-as="i">
              <tr>
                <td style="font-weight:600">{{i.emp}}</td><td>{{i.desc}}</td>
                <td><span style="{{i.prioStyle}}">{{i.prio}}</span></td>
                <td style="{{i.sitStyle}}">{{i.sit}}</td>
                <td><template data-if="i.pode"><button onClick="{{i.pedir}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;min-height:40px">Solicitar ao cliente</button></template></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
      <h2 style="margin:0;font-size:16px">Guias e vencimentos</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:680px">
          <thead><tr><th>Guia</th><th>Empresa</th><th>Vencimento</th><th>Cliente</th><th></th></tr></thead>
          <tbody>
            <tr><td style="font-weight:600">DAS · Outubro/2026</td><td>Marcenaria Ipê Ltda</td><td>20/11/2026</td><td style="color:#0A5F52;font-weight:600">Marcou como paga</td><td></td></tr>
            <tr><td style="font-weight:600">DAS · Outubro/2026</td><td>Padaria Trigo Bom</td><td>20/11/2026</td><td style="color:#A3470A;font-weight:600">{{lembrete}}</td><td><button onClick="{{lembrar}}" style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;min-height:40px">Reenviar lembrete</button></td></tr>
            <tr><td style="font-weight:600">DARF PIS/COFINS</td><td>Comercial Boa Vista Ltda</td><td>25/11/2026</td><td style="color:#5A6B78">Baixada, pagamento não informado</td><td></td></tr>
          </tbody>
        </table>
      </div>
    </section>

</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pedidos: { 2: true }, lembrou: false }; }
  renderVals() {
    const base = [
      ['Padaria Trigo Bom', 'Extrato bancário de outubro não enviado', 'Alta'],
      ['Comercial Boa Vista Ltda', '5 lançamentos sem categoria', 'Média'],
      ['Marcenaria Ipê Ltda', '2 recebimentos sem nota correspondente', 'Média'],
      ['Comercial Boa Vista Ltda', 'Certificado A1 vence em 12 dias', 'Alta'],
      ['Distribuidora Rio Verde S.A.', 'NF-e 2210 rejeitada (NCM sem CEST)', 'Alta']
    ];
    const ped = this.state.pedidos;
    const itens = base.map((b, i) => ({
      emp: b[0], desc: b[1], prio: b[2],
      prioStyle: 'padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;' + (b[2] === 'Alta' ? 'background:#FDECEA;color:#9B1C1C' : 'background:#FFF4E5;color:#8A3B08'),
      sit: ped[i] ? 'Solicitado · aparece no app do cliente' : 'Aberta',
      sitStyle: ped[i] ? 'color:#0A5F52;font-weight:600' : 'color:#5A6B78',
      pode: !ped[i],
      pedir: () => this.setState({ pedidos: Object.assign({}, ped, { [i]: true }) })
    }));
    const n = Object.keys(ped).length;
    return {
      itens, abertas: String(base.length - n), aguardando: String(n),
      lembrete: this.state.lembrou ? 'Lembrete reenviado agora' : 'Enviada, não aberta',
      lembrar: () => this.setState({ lembrou: true })
    };
  }
}

DC.start(Component);
</script>
</body>
