</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Financeiro</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Financeiro</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Conta: Banco Exemplo · ag. 0001 · Novembro/2026</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button onClick="{{abrirForm}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">+ Novo lançamento</button>
        <span style="position:relative;display:inline-flex;align-items:center;background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px;box-sizing:border-box">Importar extrato (OFX)<input type="file" accept=".ofx,.OFX" onChange="{{lerOfx}}" aria-label="Importar extrato OFX" style="position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0"></span>
        <a href="demo/Extrato-exemplo-novembro.ofx" download style="display:inline-flex;align-items:center;background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;text-decoration:none;color:#14212B">Baixar OFX de exemplo</a>
        <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Buscar pela API do banco</button>
      </div>
    </div>
    <template data-if="formAberto">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
          <h2 style="margin:0;font-size:16px">Novo lançamento</h2>
          <div role="group" aria-label="Tipo de lançamento" style="display:flex;background:#E9EDF0;border-radius:10px;padding:4px;gap:4px">
            <template data-for="tiposLanc" data-as="t"><button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></template>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
          <label>Descrição<input value="{{fDesc}}" onChange="{{setDesc}}" placeholder="Ex.: Aluguel do galpão"></label>
          <label>Valor (R$)<input value="{{fValor}}" onChange="{{setValor}}" placeholder="0,00" inputmode="decimal"></label>
          <label>Vencimento<input value="{{fVenc}}" onChange="{{setVenc}}"></label>
          <label>Categoria<select onChange="{{setCat}}"><template data-for="cats" data-as="c"><option>{{c}}</option></template></select></label>
          <label>Conta<select><option>Banco Exemplo · ag. 0001</option><option>Caixa da loja</option></select></label>
          <label>Repetir<select onChange="{{setRec}}"><option>Não repetir</option><option>Todo mês</option><option>Parcelar em 3x</option></select></label>
        </div>
        <label style="flex-direction:row;align-items:center;gap:10px"><input type="checkbox" onChange="{{setPago}}" style="width:20px;height:20px;min-height:0">Já foi pago / recebido</label>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button onClick="{{salvarLanc}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Salvar lançamento</button>
          <button onClick="{{fecharForm}}" style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Cancelar</button>
          <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Anexar comprovante</button>
        </div>
      </section>
    </template>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Saldo em conta</div><div style="font-size:28px;font-weight:700;margin-top:6px">{{saldo}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">A receber (30 dias)</div><div style="font-size:28px;font-weight:700;margin-top:6px">{{receber}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">A pagar (30 dias)</div><div style="font-size:28px;font-weight:700;margin-top:6px">R$ 2.410,00</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Pendentes de conciliação</div><div style="font-size:28px;font-weight:700;margin-top:6px;color:#A3470A">{{pend}}</div></div>
    </div>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:17px">Conciliação do extrato</h2><span style="font-size:13px;color:#5A6B78">{{arquivoTxt}}</span></div>
      <template data-if="semExtrato">
        <p style="margin:0;font-size:14px;color:#5A6B78">Nenhum extrato importado neste período. Baixe o <strong>OFX de exemplo</strong> (ou exporte um do seu banco) e clique em <strong>Importar extrato (OFX)</strong>: o sistema lê o arquivo e sugere a conciliação de cada lançamento.</p>
      </template>
      <template data-if="comExtrato">
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:760px">
            <thead><tr><th>Data</th><th>Lançamento no banco</th><th>Valor</th><th>Sugestão do sistema</th><th></th></tr></thead>
            <tbody>
              <template data-for="linhas" data-as="l">
                <tr>
                  <td>{{l.data}}</td>
                  <td style="font-weight:600">{{l.hist}}</td>
                  <td style="{{l.valStyle}}">{{l.valor}}</td>
                  <td>{{l.sug}}</td>
                  <td>
                    <template data-if="l.aberto"><button onClick="{{l.ok}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;min-height:40px">Confirmar</button></template>
                    <template data-if="l.feito"><span style="color:#0E7C6B;font-weight:600;font-size:13px">Conciliado</span></template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <button onClick="{{todos}}" style="align-self:flex-start;background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Confirmar todas as sugestões</button>
      </template>
    </section>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px">Contas a receber</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:620px">
          <thead><tr><th>Origem</th><th>Cliente</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead>
          <tbody>
            <tr><td>NF-e 1043 · entrada</td><td>Carlos Mendes</td><td>27/11/2026</td><td>R$ 1.767,00</td><td style="{{recStyle}}">{{recSit}}</td></tr>
            <tr><td>NF-e 1043 · parcela 2/2</td><td>Carlos Mendes</td><td>27/12/2026</td><td>R$ 1.767,00</td><td style="color:#5A6B78">A prazo · 30 dias</td></tr>
            <tr><td>NFS-e 88 · montagem</td><td>Loja Casa Bela</td><td>15/11/2026</td><td>R$ 650,00</td><td style="color:#A3470A;font-weight:600">Vencida, sem entrada no banco</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px">Lançamentos do mês</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:680px">
          <thead><tr><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead>
          <tbody>
            <template data-for="lancs" data-as="x">
              <tr><td><span style="{{x.tipoStyle}}">{{x.tipo}}</span></td><td style="font-weight:600">{{x.desc}}{{x.rec}}</td><td>{{x.cat}}</td><td>{{x.venc}}</td><td style="font-weight:600">{{x.valor}}</td><td style="{{x.sitStyle}}">{{x.sit}}</td></tr>
            </template>
          </tbody>
        </table>
      </div>
    </section>

</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  db(k, d) { try { const v = localStorage.getItem('vincula_' + k); return v ? JSON.parse(v) : d; } catch (e) { return (DCLogic.__mem && DCLogic.__mem[k]) || d; } }
  dbSet(k, v) { try { localStorage.setItem('vincula_' + k, JSON.stringify(v)); } catch (e) { DCLogic.__mem = DCLogic.__mem || {}; DCLogic.__mem[k] = v; } }
  lista() { return this.db('empresas', this.seed()); }
  seed() { return [
    { id: 'ipe', nome: 'Marcenaria Ipê Ltda', sigla: 'MI', cnpj: '11.111.111/0001-11', regime: 'Simples Nacional', cidade: 'Pompéu', uf: 'MG', ie: '001.234567.00-11', cnae: '3101-2/00 · Fabricação de móveis', notas: 42, fat: 'R$ 168.400,00', pend: 2, pendTxt: '2 lançamentos', cert: 'Válido até 03/2027', fechado: false },

    { id: 'rioverde', nome: 'Distribuidora Rio Verde S.A.', sigla: 'RV', cnpj: '55.555.555/0001-55', regime: 'Lucro Real', cidade: 'Divinópolis', uf: 'MG', ie: '223.445566.00-77', cnae: '4639-7/01 · Atacado de alimentos', notas: 24, fat: 'R$ 1.284.000,00', pend: 3, pendTxt: '2 lançamentos', cert: 'Válido até 05/2027', fechado: false },

    { id: 'bompreco', nome: 'Mercado Bom Preço Ltda', sigla: 'BP', cnpj: '88.888.888/0001-88', regime: 'Lucro Presumido', cidade: 'Santos', uf: 'SP', ie: '633.112.233.114', cnae: '4711-3/02 · Supermercado', notas: 412, fat: 'R$ 296.300,00', pend: 3, pendTxt: '3 lançamentos', cert: 'Válido até 06/2027', fechado: false },
    { id: 'valedosol', nome: 'Agropecuária Vale do Sol S.A.', sigla: 'VS', cnpj: '99.999.999/0001-99', regime: 'Lucro Real', cidade: 'Uberlândia', uf: 'MG', ie: '702.334455.00-88', cnae: '0151-2/01 · Criação de bovinos', notas: 87, fat: 'R$ 2.410.000,00', pend: 1, pendTxt: 'NF-e rejeitada', cert: 'Válido até 09/2027', fechado: false }

  empresaId() { if (true) return 'ipe'; if (this.state.__emp) return this.state.__emp; try { return localStorage.getItem('vincula_empresa') || 'ipe'; } catch (e) { return 'ipe'; } }
  empresa() { const id = this.empresaId(); return this.lista().find((x) => x.id === id) || this.lista()[0]; }
  selecionar(id) { try { localStorage.setItem('vincula_empresa', id); } catch (e) {} }
  trocarEmpresa(id) { this.selecionar(id); this.setState({ __emp: id, regime: null }); }
  renderVals() {
    try { localStorage.removeItem('vincula_modo'); } catch (x) {}
    const e = this.empresa();
    const v = this._rv();
    return Object.assign({ ctxVisivel: true, ctx: e, ctxId: e.id, ctxOpcoes: this.lista().map((x) => ({ id: x.id, label: x.nome + ' · ' + x.regime + ' · ' + x.uf })), trocar: (ev) => this.trocarEmpresa(ev.target.value) }, v);
  }

  constructor(p) { super(p); this.state = { importado: false, feitos: {}, ofx: null, arquivo: '', form: false, fTipo: 'Despesa', fDesc: '', fValor: '', fVenc: '10/12/2026', fCat: 'Aluguel', fRec: 'Não repetir', fPago: false, novos: [] }; }
  _rv() {
    const conhecidos = [
      { v: 1767, sug: 'Baixa: NF-e 1043 · entrada (50%)' }, { v: -1250, sug: 'Conta a pagar: compra de madeira (NF 5521)' },
      { v: -39.9, sug: 'Categoria: tarifas bancárias' }, { v: -512.4, sug: 'Conta a pagar: DAS outubro' }, { v: 650, sug: 'Baixa: NFS-e 88 · Loja Casa Bela (vencida)' }
    ];
    const sugerir = (v, h) => { const k = conhecidos.find((c) => Math.abs(c.v - v) < 0.005); if (k) return k.sug; if (/POSTO|COMBUST/i.test(h)) return 'Categoria: combustível'; if (/TAR|TARIFA/i.test(h)) return 'Categoria: tarifas bancárias'; return v > 0 ? 'Sem nota correspondente · criar recebimento?' : 'Sem conta correspondente · categorizar'; };
    const padrao = [
      { data: '27/11', hist: 'PIX RECEBIDO CARLOS MENDES', v: 1767 }, { data: '26/11', hist: 'PAG BOLETO MADEIREIRA SUL', v: -1250 },
      { data: '25/11', hist: 'TAR PACOTE SERVICOS', v: -39.9 }, { data: '24/11', hist: 'PIX RECEBIDO J OLIVEIRA', v: 480 }
    ];
    const fmtV = (n) => (n < 0 ? '− ' : '+ ') + 'R$ ' + Math.abs(n).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const base = (this.state.ofx || padrao).map((t, i) => ({ id: 'l' + i, data: t.data, hist: t.hist, v: t.v, valor: fmtV(t.v), sug: sugerir(t.v, t.hist) }));
    const f = this.state.feitos;
    const linhas = base.map((l) => ({
      ...l,
      feito: !!f[l.id], aberto: !f[l.id],
      valStyle: l.v > 0 ? 'color:#0E7C6B;font-weight:600' : 'color:#14212B;font-weight:600',
      ok: () => this.setState({ feitos: Object.assign({}, f, { [l.id]: true }) })
    }));
    const imp = this.state.importado;
    const pendentes = imp ? linhas.filter((l) => l.aberto).length : 0;
    const entradaOk = imp && base.some((l) => Math.abs(l.v - 1767) < 0.005 && f[l.id]);
    let saldo = 8420.35;
    base.forEach((l) => { if (imp && f[l.id]) saldo += l.v; });
    const fmt = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const st = this.state;
    const seg = (on) => 'border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;min-height:38px;' + (on ? 'background:#fff;color:#14212B;box-shadow:0 1px 3px rgba(16,35,50,.15)' : 'background:transparent;color:#5A6B78');
    const cats = st.fTipo === 'Despesa' ? ['Aluguel', 'Matéria-prima', 'Energia', 'Combustível', 'Salários', 'Impostos', 'Outras despesas'] : ['Vendas', 'Serviços', 'Outras receitas'];
    const tag = (t) => 'padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;' + (t === 'Receita' ? 'background:#E6F4F1;color:#0A5F52' : 'background:#FDECEA;color:#9B1C1C');
    const baseL = [
      { tipo: 'Despesa', desc: 'Compra de madeira · NF 5521', cat: 'Matéria-prima', venc: '26/11/2026', valor: 'R$ 1.250,00', pago: true, rec: '' },
      { tipo: 'Despesa', desc: 'Energia elétrica', cat: 'Energia', venc: '05/12/2026', valor: 'R$ 480,00', pago: false, rec: '' },
      { tipo: 'Receita', desc: 'NF-e 1043 · parcela 2/2', cat: 'Vendas', venc: '27/12/2026', valor: 'R$ 1.767,00', pago: false, rec: '' }
    ];
    const salvos = this.db('lanc_' + this.empresa().id, []);
    const lancs = salvos.concat(baseL).map((x) => ({ ...x, tipoStyle: tag(x.tipo), sit: x.pago ? (x.tipo === 'Receita' ? 'Recebido' : 'Pago') : 'Em aberto', sitStyle: x.pago ? 'color:#0A5F52;font-weight:600' : 'color:#5A6B78' }));
    return {
      lancs, cats, formAberto: st.form,
      tiposLanc: ['Despesa', 'Receita'].map((t) => ({ label: t === 'Despesa' ? 'Conta a pagar' : 'Conta a receber', pick: () => this.setState({ fTipo: t, fCat: t === 'Despesa' ? 'Aluguel' : 'Vendas' }), style: seg(st.fTipo === t) })),
      fDesc: st.fDesc, fValor: st.fValor, fVenc: st.fVenc,
      setDesc: (e) => this.setState({ fDesc: e.target.value }),
      setValor: (e) => this.setState({ fValor: e.target.value }),
      setVenc: (e) => this.setState({ fVenc: e.target.value }),
      setCat: (e) => this.setState({ fCat: e.target.value }),
      setRec: (e) => this.setState({ fRec: e.target.value }),
      setPago: (e) => this.setState({ fPago: e.target.checked }),
      abrirForm: () => this.setState({ form: true }),
      fecharForm: () => this.setState({ form: false }),
      salvarLanc: () => {
        const v = parseFloat(String(st.fValor).replace(/\./g, '').replace(',', '.')) || 0;
        const novo = { tipo: st.fTipo, desc: st.fDesc || (st.fTipo === 'Despesa' ? 'Nova despesa' : 'Nova receita'), cat: st.fCat, venc: st.fVenc, valor: fmt(v), pago: st.fPago, rec: st.fRec === 'Não repetir' ? '' : ' · ' + st.fRec.toLowerCase() };
        this.dbSet('lanc_' + this.empresa().id, [novo].concat(this.db('lanc_' + this.empresa().id, [])));
        this.setState({ form: false, fDesc: '', fValor: '', fPago: false });
      },
      linhas,
      semExtrato: !imp, comExtrato: imp,
      pend: String(pendentes),
      saldo: fmt(saldo),
      receber: entradaOk ? 'R$ 2.417,00' : 'R$ 4.184,00',
      recSit: entradaOk ? 'Recebido · baixa automática' : 'Aguardando pagamento',
      recStyle: entradaOk ? 'color:#0E7C6B;font-weight:600' : 'color:#5A6B78',
      importar: () => this.setState({ importado: true }),
      todos: () => { const t = {}; base.forEach((l) => { t[l.id] = true; }); this.setState({ feitos: t }); },
      arquivoTxt: this.state.arquivo ? 'Arquivo: ' + this.state.arquivo + ' · ' + base.length + ' lançamentos' : '',
      lerOfx: (ev) => {
        const file = ev.target.files && ev.target.files[0]; if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          const txt = String(r.result);
          const partes = txt.split(/<STMTTRN>/i).slice(1);
          const tag = (p, t) => { const m = p.match(new RegExp('<' + t + '>([^<\\r\\n]*)', 'i')); return m ? m[1].trim() : ''; };
          const lista = partes.map((p) => { const d = tag(p, 'DTPOSTED'); const v = parseFloat(tag(p, 'TRNAMT').replace(',', '.')) || 0; return { data: d.slice(6, 8) + '/' + d.slice(4, 6), hist: tag(p, 'MEMO') || tag(p, 'NAME') || 'Lançamento', v }; });
          if (!lista.length) { this.setState({ arquivo: file.name + ' (nenhum lançamento encontrado)', importado: false }); return; }
          this.setState({ ofx: lista, importado: true, feitos: {}, arquivo: file.name });
        };
        r.readAsText(file);
      }
    };
  }
}

DC.start(Component);
