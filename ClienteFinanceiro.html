<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro · Vincula (protótipo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F6F9;color:#14212B}
a{color:#0E7C6B}a:hover{color:#0A5F52}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C5D3DD;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:#13304B;color:#fff}
.nav a.on{background:#0E7C6B;color:#fff}
button{font-family:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4D59;font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD4DB;border-radius:8px;background:#fff;color:#14212B;min-height:42px;box-sizing:border-box}
th{font-weight:600;font-size:11px;color:#5A6B78;text-align:left;padding:10px 12px;border-bottom:1px solid #E4E9EE;background:#F8FAFB;text-transform:uppercase;letter-spacing:.05em}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4}
tbody tr:hover{background:#F7FBFA}
h1{letter-spacing:-.02em}
</style>

</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E4E9EE;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;box-sizing:border-box">
    <a href="ClienteVenda.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B2239"><span style="width:34px;height:34px;border-radius:9px;background:#0E7C6B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></span><span style="font-weight:800;font-size:19px;letter-spacing:-.03em">Vincula</span><span style="font-size:11px;font-weight:700;color:#0A5F52;background:#E6F4F1;border-radius:6px;padding:2px 6px">ERP</span></a>
    <button style="display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:#14212B;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg><span>Marcenaria Ipê Ltda</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div style="flex:1 1 220px;max-width:460px;display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:0 12px;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input aria-label="Buscar" placeholder="Buscar empresa, nota, cliente, produto…" style="border:0;background:transparent;min-height:38px;padding:0;flex:1;min-width:0;outline:none"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button aria-label="Notificações" style="position:relative;width:40px;height:40px;border-radius:9px;border:1px solid #E4E9EE;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#D97706"></span></button>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:50%;background:#0B2239;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">CM</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:13px;font-weight:600">Carlos Mendes</span><span style="font-size:12px;color:#5A6B78">Marcenaria Ipê Ltda</span></span></div>
    </div>
  </header>
<div style="display:flex;flex-wrap:wrap;flex:1">
  <nav class="nav" style="flex:1 1 220px;max-width:248px;background:#0B2239;padding:18px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">MARCENARIA IPÊ LTDA</div>
    <a href="ClienteVenda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Vendas e notas fiscais</span></a>
    <a class="on" href="ClienteFinanceiro.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg><span>Financeiro</span></a>
    <a href="ClienteIntegracao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg><span>Minha contabilidade</span><span style="margin-left:auto;background:#D97706;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px">1</span></a>
    <a href="LoginCliente.html" style="margin-top:18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>
  </nav>
  <main id="dc-root" style="flex:999 1 560px;min-width:0;padding:22px 28px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"></main>
</div>
</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Financeiro</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Financeiro</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Conta: Banco Exemplo · ag. 0001 · Novembro/2026</p>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <button onClick="{{importar}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Importar extrato (OFX)</button>
        <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Buscar pela API do banco</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Saldo em conta</div><div style="font-size:28px;font-weight:700;margin-top:6px">{{saldo}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">A receber (30 dias)</div><div style="font-size:28px;font-weight:700;margin-top:6px">{{receber}}</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">A pagar (30 dias)</div><div style="font-size:28px;font-weight:700;margin-top:6px">R$ 2.410,00</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Pendentes de conciliação</div><div style="font-size:28px;font-weight:700;margin-top:6px;color:#A3470A">{{pend}}</div></div>
    </div>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px">Conciliação do extrato</h2>
      <template data-if="semExtrato">
        <p style="margin:0;font-size:14px;color:#5A6B78">Nenhum extrato importado neste período. Clique em <strong>Importar extrato (OFX)</strong> para ver a conciliação automática.</p>
      </template>
      <template data-if="comExtrato">
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:760px">
            <thead><tr><th>Data</th><th>Lançamento no banco</th><th>Valor</th><th>Sugestão do sistema</th><th></th></tr></thead>
            <tbody>
              <template data-for="linhas" data-as="l">
                <tr>
                  <td>{{l.data}}</td>
                  <td style="font-weight:600">{{l.hist}}</td>
                  <td style="{{l.valStyle}}">{{l.valor}}</td>
                  <td>{{l.sug}}</td>
                  <td>
                    <template data-if="l.aberto"><button onClick="{{l.ok}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;min-height:40px">Confirmar</button></template>
                    <template data-if="l.feito"><span style="color:#0E7C6B;font-weight:600;font-size:13px">Conciliado</span></template>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <button onClick="{{todos}}" style="align-self:flex-start;background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Confirmar todas as sugestões</button>
      </template>
    </section>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px">Contas a receber</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:620px">
          <thead><tr><th>Origem</th><th>Cliente</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead>
          <tbody>
            <tr><td>NF-e 1043 · entrada</td><td>Carlos Mendes</td><td>27/11/2026</td><td>R$ 1.767,00</td><td style="{{recStyle}}">{{recSit}}</td></tr>
            <tr><td>NF-e 1043 · parcela 2/2</td><td>Carlos Mendes</td><td>27/12/2026</td><td>R$ 1.767,00</td><td style="color:#5A6B78">A prazo · 30 dias</td></tr>
            <tr><td>NFS-e 88 · montagem</td><td>Loja Casa Bela</td><td>15/11/2026</td><td>R$ 650,00</td><td style="color:#A3470A;font-weight:600">Vencida, sem entrada no banco</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  
</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { importado: false, feitos: {} }; }
  renderVals() {
    const base = [
      { id: 'a', data: '27/11', hist: 'PIX RECEBIDO CARLOS MENDES', valor: '+ R$ 1.767,00', v: 1767, sug: 'Baixa: NF-e 1043 · entrada (50%)' },
      { id: 'b', data: '26/11', hist: 'PAG BOLETO MADEIREIRA SUL', valor: '− R$ 1.250,00', v: -1250, sug: 'Conta a pagar: compra de madeira (NF 5521)' },
      { id: 'c', data: '25/11', hist: 'TAR PACOTE SERVICOS', valor: '− R$ 39,90', v: -39.9, sug: 'Categoria: tarifas bancárias' },
      { id: 'd', data: '24/11', hist: 'PIX RECEBIDO J OLIVEIRA', valor: '+ R$ 480,00', v: 480, sug: 'Sem nota correspondente · criar recebimento?' }
    ];
    const f = this.state.feitos;
    const linhas = base.map((l) => ({
      ...l,
      feito: !!f[l.id], aberto: !f[l.id],
      valStyle: l.v > 0 ? 'color:#0E7C6B;font-weight:600' : 'color:#14212B;font-weight:600',
      ok: () => this.setState({ feitos: Object.assign({}, f, { [l.id]: true }) })
    }));
    const imp = this.state.importado;
    const pendentes = imp ? linhas.filter((l) => l.aberto).length : 0;
    const entradaOk = imp && !!f.a;
    let saldo = 8420.35;
    base.forEach((l) => { if (imp && f[l.id]) saldo += l.v; });
    const fmt = (n) => 'R$ ' + n.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return {
      linhas,
      semExtrato: !imp, comExtrato: imp,
      pend: String(pendentes),
      saldo: fmt(saldo),
      receber: entradaOk ? 'R$ 2.417,00' : 'R$ 4.184,00',
      recSit: entradaOk ? 'Recebido · baixa automática' : 'Aguardando pagamento',
      recStyle: entradaOk ? 'color:#0E7C6B;font-weight:600' : 'color:#5A6B78',
      importar: () => this.setState({ importado: true }),
      todos: () => this.setState({ feitos: { a: true, b: true, c: true, d: true } })
    };
  }
}

DC.start(Component);
</script>
</body>
</html>
