<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha contabilidade · Vincula (protótipo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F6F9;color:#14212B}
a{color:#0E7C6B}a:hover{color:#0A5F52}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C5D3DD;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:#13304B;color:#fff}
.nav a.on{background:#0E7C6B;color:#fff}
button{font-family:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4D59;font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD4DB;border-radius:8px;background:#fff;color:#14212B;min-height:42px;box-sizing:border-box}
th{font-weight:600;font-size:11px;color:#5A6B78;text-align:left;padding:10px 12px;border-bottom:1px solid #E4E9EE;background:#F8FAFB;text-transform:uppercase;letter-spacing:.05em}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4}
tbody tr:hover{background:#F7FBFA}
h1{letter-spacing:-.02em}
</style>

</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E4E9EE;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;box-sizing:border-box">
    <a href="ClienteVenda.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B2239"><span style="width:34px;height:34px;border-radius:9px;background:#0E7C6B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></span><span style="font-weight:800;font-size:19px;letter-spacing:-.03em">Vincula</span><span style="font-size:11px;font-weight:700;color:#0A5F52;background:#E6F4F1;border-radius:6px;padding:2px 6px">ERP</span></a>
    <button style="display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:#14212B;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg><span>Marcenaria Ipê Ltda</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div style="flex:1 1 220px;max-width:460px;display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:0 12px;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input aria-label="Buscar" placeholder="Buscar empresa, nota, cliente, produto…" style="border:0;background:transparent;min-height:38px;padding:0;flex:1;min-width:0;outline:none"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button aria-label="Notificações" style="position:relative;width:40px;height:40px;border-radius:9px;border:1px solid #E4E9EE;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#D97706"></span></button>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:50%;background:#0B2239;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">CM</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:13px;font-weight:600">Carlos Mendes</span><span style="font-size:12px;color:#5A6B78">Marcenaria Ipê Ltda</span></span></div>
    </div>
  </header>
<div style="display:flex;flex-wrap:wrap;flex:1">
  <nav class="nav" style="flex:1 1 220px;max-width:248px;background:#0B2239;padding:18px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">MARCENARIA IPÊ LTDA</div>
    <a href="ClienteVenda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Vendas e notas fiscais</span></a>
    <a href="ClienteFinanceiro.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg><span>Financeiro</span></a>
    <a class="on" href="ClienteIntegracao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg><span>Minha contabilidade</span><span style="margin-left:auto;background:#D97706;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px">1</span></a>
    <a href="LoginCliente.html" style="margin-top:18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>
  </nav>
  <main id="dc-root" style="flex:999 1 560px;min-width:0;padding:22px 28px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"></main>
</div>
</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Minha contabilidade</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Minha contabilidade</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Tudo o que você emite, compra e recebe vai sozinho para o Escritório Exemplo.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px;background:#ECF7F4;border:1px solid #BFE1D9;border-radius:999px;padding:8px 14px;font-size:13px;color:#0A5F52;font-weight:600">
        <span style="width:8px;height:8px;border-radius:50%;background:#0E7C6B"></span>Conectado · última sincronização há 2 min
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">
      <template data-for="envios" data-as="e">
        <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:16px;display:flex;flex-direction:column;gap:6px">
          <div style="font-size:13px;color:#5A6B78">{{e.nome}}</div>
          <div style="font-size:26px;font-weight:700">{{e.qtd}}</div>
          <div style="{{e.st}}">{{e.sit}}</div>
        </div>
      </template>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:12px">
        <div><h2 style="margin:0;font-size:16px">Fechamento de Outubro/2026</h2><p style="margin:4px 0 0;font-size:13px;color:#5A6B78">Confira os itens e envie o mês para a contabilidade.</p></div>
        <template data-for="checks" data-as="c">
          <button onClick="{{c.toggle}}" aria-pressed="{{c.pressed}}" style="display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1px solid #EEF1F4;border-radius:10px;padding:12px;min-height:48px;font-size:14px;color:#14212B">
            <span style="{{c.box}}">{{c.mark}}</span><span>{{c.txt}}</span>
          </button>
        </template>
        <template data-if="naoFechado">
          <button onClick="{{fechar}}" style="{{btnFechar}}">Fechar mês e enviar à contabilidade</button>
        </template>
        <template data-if="fechado">
          <div role="status" style="background:#ECF7F4;border:1px solid #BFE1D9;border-radius:10px;padding:14px;font-size:14px;color:#0A5F52"><strong>Outubro enviado.</strong> A contabilidade recebeu 42 notas, 21 notas de compra, 2 extratos e 156 lançamentos em 27/11/2026 às 10:15.</div>
        </template>
      </section>
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:12px">
        <h2 style="margin:0;font-size:16px">Pedidos da contabilidade</h2>
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #F5D9A8;background:#FFFAF0;border-radius:10px;padding:12px">
          <div><div style="font-weight:600;font-size:14px">Explicar 2 recebimentos sem nota</div><div style="font-size:12px;color:#5A6B78">PIX J OLIVEIRA R$ 480,00 · TED R$ 150,00</div></div>
          <template data-if="pedidoAberto"><button onClick="{{responder}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;min-height:40px">Responder</button></template>
          <template data-if="pedidoFeito"><span style="color:#0A5F52;font-weight:600;font-size:13px">Respondido</span></template>
        </div>
        <h2 style="margin:8px 0 0;font-size:16px">Documentos recebidos</h2>
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #EEF1F4;border-radius:10px;padding:12px">
          <div><div style="font-weight:600;font-size:14px">Guia do DAS · Outubro/2026</div><div style="font-size:12px;color:#5A6B78">R$ 512,40 · vence 20/11/2026</div></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
            <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;min-height:40px">Baixar</button>
            <button onClick="{{pagar}}" style="{{btnPagar}}">{{txtPagar}}</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #EEF1F4;border-radius:10px;padding:12px">
          <div><div style="font-weight:600;font-size:14px">Holerites · Outubro/2026</div><div style="font-size:12px;color:#5A6B78">3 funcionários</div></div>
          <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;min-height:40px">Baixar</button>
        </div>
      </section>
    </div>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:12px">
      <h2 style="margin:0;font-size:16px">Conversa com a contabilidade</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        <template data-for="msgs" data-as="m">
          <div style="{{m.wrap}}"><div style="{{m.bubble}}"><div style="font-size:12px;font-weight:600;margin-bottom:4px">{{m.quem}}</div>{{m.txt}}</div></div>
        </template>
      </div>
      <div style="display:flex;gap:10px">
        <label style="flex:1"><span style="position:absolute;left:-9999px">Mensagem</span><input value="{{rascunho}}" onChange="{{digitar}}" placeholder="Escreva para a contabilidade" style="width:100%"></label>
        <button onClick="{{enviar}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:0 18px;font-weight:600;font-size:14px;min-height:44px">Enviar</button>
      </div>
    </section>

</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { checks: [true, true, false, false], fechado: false, pago: false, respondido: false, rascunho: '',
      msgs: [{ eu: false, quem: 'Ana · Escritório Exemplo', txt: 'Bom dia! Ficaram 2 recebimentos sem nota em outubro, pode me explicar?' }] };
  }
  renderVals() {
    const ok = 'font-size:12px;color:#0A5F52;font-weight:600';
    const warn = 'font-size:12px;color:#A3470A;font-weight:600';
    const envios = [
      { nome: 'Notas emitidas', qtd: '42', sit: 'Enviadas automaticamente', st: ok },
      { nome: 'Notas de compra', qtd: '21', sit: 'Capturadas pelo CNPJ', st: ok },
      { nome: 'Extratos bancários', qtd: '2', sit: 'Conciliados', st: ok },
      { nome: 'Lançamentos', qtd: '156', sit: '2 sem categoria', st: warn }
    ];
    const txts = ['Todas as notas do mês emitidas', 'Notas de compra conferidas', 'Extratos importados e conciliados', 'Lançamentos com categoria'];
    const c = this.state.checks;
    const checks = txts.map((t, i) => ({
      txt: t, pressed: c[i] ? 'true' : 'false', mark: c[i] ? '✓' : '',
      box: 'flex:none;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;' + (c[i] ? 'background:#0E7C6B;color:#fff;border:1px solid #0E7C6B' : 'background:#fff;border:1.5px solid #9AA9B4'),
      toggle: () => { const n = c.slice(); n[i] = !n[i]; this.setState({ checks: n }); }
    }));
    const tudo = c.every((x) => x);
    const msgs = this.state.msgs.map((m) => ({
      ...m,
      wrap: 'display:flex;' + (m.eu ? 'justify-content:flex-end' : 'justify-content:flex-start'),
      bubble: 'max-width:70%;padding:10px 14px;border-radius:12px;font-size:14px;' + (m.eu ? 'background:#0B2239;color:#fff' : 'background:#F1F4F7;color:#14212B')
    }));
    return {
      envios, checks, msgs,
      fechado: this.state.fechado, naoFechado: !this.state.fechado,
      btnFechar: 'border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px;' + (tudo ? 'background:#0E7C6B;color:#fff;border:1px solid #0E7C6B' : 'background:#E9EDF0;color:#5A6B78;border:1px solid #E9EDF0'),
      fechar: () => { if (tudo) this.setState({ fechado: true }); },
      pedidoAberto: !this.state.respondido, pedidoFeito: this.state.respondido,
      responder: () => this.setState({ respondido: true, msgs: this.state.msgs.concat([{ eu: true, quem: 'Você', txt: 'O PIX de R$ 480 foi um sinal de encomenda e a TED de R$ 150 é reembolso de frete.' }]) }),
      txtPagar: this.state.pago ? 'Paga ✓' : 'Marcar como paga',
      btnPagar: 'border-radius:8px;padding:9px 12px;font-weight:600;font-size:13px;min-height:40px;' + (this.state.pago ? 'background:#ECF7F4;color:#0A5F52;border:1px solid #BFE1D9' : 'background:#0E7C6B;color:#fff;border:1px solid #0E7C6B'),
      pagar: () => this.setState({ pago: true }),
      rascunho: this.state.rascunho,
      digitar: (e) => this.setState({ rascunho: e.target.value }),
      enviar: () => { const t = this.state.rascunho.trim(); if (t) this.setState({ rascunho: '', msgs: this.state.msgs.concat([{ eu: true, quem: 'Você', txt: t }]) }); }
    };
  }
}

DC.start(Component);
</script>
</body>
</html>
