</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Contabilidade › Visão geral</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Painel do contador</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Visão geral de todas as empresas clientes · Novembro/2026</p>
      </div>
      <a href="Empresa.html" style="background:#0E7C6B;color:#fff;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px">+ Nova empresa</a>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Empresas ativas</div><div style="font-size:30px;font-weight:700;margin-top:6px">6</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Notas emitidas no mês</div><div style="font-size:30px;font-weight:700;margin-top:6px">148</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Conciliações pendentes</div><div style="font-size:30px;font-weight:700;margin-top:6px;color:#A3470A">9</div></div>
      <div style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:18px"><div style="font-size:13px;color:#5A6B78">Certificados vencendo (30 dias)</div><div style="font-size:30px;font-weight:700;margin-top:6px;color:#A3470A">1</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2 style="margin:0;font-size:16px">Notas emitidas por mês</h2><span style="font-size:12px;color:#5A6B78">Todas as empresas · NF-e, NFC-e e NFS-e</span></div>
        <div style="display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;color:#5A6B78">96</span><div style="width:100%;max-width:44px;height:84px;background:#B9DDD6;border-radius:6px 6px 0 0"></div><span style="font-size:12px;color:#5A6B78">Jun</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;color:#5A6B78">104</span><div style="width:100%;max-width:44px;height:92px;background:#B9DDD6;border-radius:6px 6px 0 0"></div><span style="font-size:12px;color:#5A6B78">Jul</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;color:#5A6B78">121</span><div style="width:100%;max-width:44px;height:106px;background:#B9DDD6;border-radius:6px 6px 0 0"></div><span style="font-size:12px;color:#5A6B78">Ago</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;color:#5A6B78">117</span><div style="width:100%;max-width:44px;height:103px;background:#B9DDD6;border-radius:6px 6px 0 0"></div><span style="font-size:12px;color:#5A6B78">Set</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;color:#5A6B78">139</span><div style="width:100%;max-width:44px;height:122px;background:#B9DDD6;border-radius:6px 6px 0 0"></div><span style="font-size:12px;color:#5A6B78">Out</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font-size:12px;font-weight:700;color:#0A5F52">148</span><div style="width:100%;max-width:44px;height:130px;background:#0E7C6B;border-radius:6px 6px 0 0"></div><span style="font-size:12px;font-weight:600">Nov</span></div>
        </div>
      </section>
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px"><h2 style="margin:0;font-size:16px">Pendências por tipo</h2><a href="Pendencias.html" style="font-size:13px;font-weight:600;text-decoration:none">Ver todas →</a></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:14px"><div style="display:flex;justify-content:space-between"><span>Lançamentos sem categoria</span><strong>9</strong></div><div style="height:8px;background:#EEF1F4;border-radius:99px"><div style="width:90%;height:8px;background:#D97706;border-radius:99px"></div></div></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:14px"><div style="display:flex;justify-content:space-between"><span>Extratos não enviados</span><strong>1</strong></div><div style="height:8px;background:#EEF1F4;border-radius:99px"><div style="width:10%;height:8px;background:#D97706;border-radius:99px"></div></div></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:14px"><div style="display:flex;justify-content:space-between"><span>Guias enviadas e não abertas</span><strong>2</strong></div><div style="height:8px;background:#EEF1F4;border-radius:99px"><div style="width:20%;height:8px;background:#0E7C6B;border-radius:99px"></div></div></div>
        <div style="display:flex;flex-direction:column;gap:6px;font-size:14px"><div style="display:flex;justify-content:space-between"><span>Certificados vencendo</span><strong>1</strong></div><div style="height:8px;background:#EEF1F4;border-radius:99px"><div style="width:10%;height:8px;background:#B42318;border-radius:99px"></div></div></div>
      </section>

    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
        <h2 style="margin:0;font-size:18px">Empresas clientes</h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <template data-for="filters" data-as="f">
            <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
          </template>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:760px">
          <thead><tr><th>Empresa</th><th>Regime</th><th>Município/UF</th><th>Notas no mês</th><th>Pendências</th><th>Certificado A1</th><th>Ações</th></tr></thead>
          <tbody>
            <template data-for="rows" data-as="r">
              <tr>
                <td><div style="font-weight:600">{{r.nome}}</div><div style="font-size:12px;color:#5A6B78">{{r.cnpj}}</div></td>
                <td><span style="background:#E6F4F1;color:#0A5F52;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap">{{r.regime}}</span></td>
                <td>{{r.cidade}}</td>
                <td>{{r.notas}}</td>
                <td style="{{r.pendStyle}}">{{r.pend}}</td>
                <td style="{{r.certStyle}}">{{r.cert}}</td>
                <td style="white-space:nowrap"><a href="Venda.html" style="font-weight:600;font-size:13px;margin-right:12px">Acessar empresa</a><a href="Documentos.html" style="font-weight:600;font-size:13px">Documentos</a></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
      <template data-if="empty"><p style="margin:0;color:#5A6B78;font-size:14px">Nenhuma empresa neste regime.</p></template>
    </section>
  
</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { regime: 'Todos' }; }
  renderVals() {
    const data = [
      { nome: 'Marcenaria Ipê Ltda', cnpj: '11.111.111/0001-11', regime: 'Simples Nacional', cidade: 'Pompéu/MG', notas: 42, pend: '2 lançamentos', cert: 'Válido até 03/2027' },
      { nome: 'Silva Instalações Elétricas', cnpj: '22.222.222/0001-22', regime: 'MEI', cidade: 'São Paulo/SP', notas: 9, pend: 'Nenhuma', cert: 'Válido até 08/2027' },
      { nome: 'Comercial Boa Vista Ltda', cnpj: '33.333.333/0001-33', regime: 'Lucro Presumido', cidade: 'Belo Horizonte/MG', notas: 61, pend: '5 lançamentos', cert: 'Vence em 12 dias' },
      { nome: 'Ana Souza Arquitetura', cnpj: '44.444.444/0001-44', regime: 'Simples Nacional', cidade: 'Campinas/SP', notas: 7, pend: 'Nenhuma', cert: 'Válido até 01/2027' },
      { nome: 'Distribuidora Rio Verde S.A.', cnpj: '55.555.555/0001-55', regime: 'Lucro Real', cidade: 'Divinópolis/MG', notas: 24, pend: '2 lançamentos', cert: 'Válido até 05/2027' },
      { nome: 'Padaria Trigo Bom', cnpj: '66.666.666/0001-66', regime: 'Simples Nacional', cidade: 'Pompéu/MG', notas: 5, pend: 'Extrato não enviado', cert: 'Válido até 10/2027' }
    ];
    const opts = ['Todos', 'MEI', 'Simples Nacional', 'Lucro Presumido', 'Lucro Real'];
    const sel = this.state.regime;
    const base = 'border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;min-height:36px;';
    const filters = opts.map((o) => ({
      label: o,
      pick: () => this.setState({ regime: o }),
      style: base + (o === sel ? 'background:#0B2239;color:#fff;border:1px solid #0B2239' : 'background:#fff;color:#14212B;border:1px solid #CBD4DB')
    }));
    const warn = 'color:#A3470A;font-weight:600';
    const rows = data.filter((d) => sel === 'Todos' || d.regime === sel).map((d) => ({
      ...d,
      pendStyle: d.pend === 'Nenhuma' ? 'color:#5A6B78' : warn,
      certStyle: d.cert.indexOf('Vence') === 0 ? warn : 'color:#5A6B78'
    }));
    return { filters, rows, empty: rows.length === 0 };
  }
}

DC.start(Component);
</script>
</body>
</html>
