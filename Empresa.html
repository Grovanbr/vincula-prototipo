    <div style="font-size:12px;color:#5A6B78;font-weight:500">Contabilidade › Empresas › Marcenaria Ipê Ltda</div>

<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { regime: 'Simples Nacional' }; }
  renderVals() {
    const mapa = {
      'MEI': ['CRT 4 (MEI) na NF-e', 'NFS-e emitida como MEI', 'Alerta ao chegar perto do limite anual de faturamento', 'Naturezas de operação prontas para MEI'],
      'Simples Nacional': ['CRT 1 e códigos CSOSN nas notas', 'Crédito de ICMS do Simples informado na NF-e', 'ISS e tributos federais dentro do DAS', 'Estimativa mensal do DAS pela faixa de faturamento'],
      'Simples (excesso de sublimite)': ['CRT 2 nas notas', 'ICMS e ISS calculados fora do DAS', 'Alertas de sublimite estadual e municipal', 'Naturezas de operação ajustadas'],
      'Lucro Presumido': ['CRT 3 e códigos CST nas notas', 'PIS/COFINS cumulativo (0,65% / 3%)', 'ICMS, IPI e ISS pelas regras cadastradas', 'Relatório de impostos do período'],
      'Lucro Real': ['CRT 3 e códigos CST nas notas', 'PIS/COFINS não cumulativo (1,65% / 7,6%)', 'Crédito de PIS/COFINS nas notas de entrada', 'Relatório de débitos e créditos do período']
    };
    const sel = this.state.regime;
    const base = 'border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;min-height:44px;';
    const regimes = Object.keys(mapa).map((k) => ({
      label: k,
      pick: () => this.setState({ regime: k }),
      style: base + (k === sel ? 'background:#0B2239;color:#fff;border:1px solid #0B2239' : 'background:#fff;color:#14212B;border:1px solid #CBD4DB')
    }));
    return { regimes, ajustes: mapa[sel], atual: sel };
  }
}

DC.start(Component);
</script>
