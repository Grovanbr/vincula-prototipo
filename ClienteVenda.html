<script>

class Component extends DCLogic {
  db(k, d) { try { const v = localStorage.getItem('vincula_' + k); return v ? JSON.parse(v) : d; } catch (e) { return (DCLogic.__mem && DCLogic.__mem[k]) || d; } }
  dbSet(k, v) { try { localStorage.setItem('vincula_' + k, JSON.stringify(v)); } catch (e) { DCLogic.__mem = DCLogic.__mem || {}; DCLogic.__mem[k] = v; } }
  lista() { return this.db('empresas', this.seed()); }
  seed() { return [
    { id: 'ipe', nome: 'Marcenaria Ipê Ltda', sigla: 'MI', cnpj: '11.111.111/0001-11', regime: 'Simples Nacional', cidade: 'Pompéu', uf: 'MG', ie: '001.234567.00-11', cnae: '3101-2/00 · Fabricação de móveis', notas: 42, fat: 'R$ 168.400,00', pend: 2, pendTxt: '2 lançamentos', cert: 'Válido até 03/2027', fechado: false },
    { id: 'silva', nome: 'Silva Instalações Elétricas', sigla: 'SI', cnpj: '22.222.222/0001-22', regime: 'MEI', cidade: 'São Paulo', uf: 'SP', ie: 'Isento', cnae: '4321-5/00 · Instalação elétrica', notas: 9, fat: 'R$ 6.300,00', pend: 0, pendTxt: 'Nenhuma', cert: 'Válido até 08/2027', fechado: true },
    { id: 'boavista', nome: 'Comercial Boa Vista Ltda', sigla: 'BV', cnpj: '33.333.333/0001-33', regime: 'Lucro Presumido', cidade: 'Belo Horizonte', uf: 'MG', ie: '062.998877.00-55', cnae: '4744-0/99 · Materiais de construção', notas: 61, fat: 'R$ 412.900,00', pend: 6, pendTxt: '5 lançamentos', cert: 'Vence em 12 dias', fechado: false },
    { id: 'ana', nome: 'Ana Souza Arquitetura', sigla: 'AS', cnpj: '44.444.444/0001-44', regime: 'Simples Nacional', cidade: 'Campinas', uf: 'SP', ie: 'Isento', cnae: '7111-1/00 · Serviços de arquitetura', notas: 7, fat: 'R$ 38.500,00', pend: 0, pendTxt: 'Nenhuma', cert: 'Válido até 01/2027', fechado: true },
    { id: 'rioverde', nome: 'Distribuidora Rio Verde S.A.', sigla: 'RV', cnpj: '55.555.555/0001-55', regime: 'Lucro Real', cidade: 'Divinópolis', uf: 'MG', ie: '223.445566.00-77', cnae: '4639-7/01 · Atacado de alimentos', notas: 24, fat: 'R$ 1.284.000,00', pend: 3, pendTxt: '2 lançamentos', cert: 'Válido até 05/2027', fechado: false },
    { id: 'trigo', nome: 'Padaria Trigo Bom', sigla: 'TB', cnpj: '66.666.666/0001-66', regime: 'Simples Nacional', cidade: 'Pompéu', uf: 'MG', ie: '001.556677.00-22', cnae: '1091-1/02 · Padaria e confeitaria', notas: 5, fat: 'R$ 52.700,00', pend: 1, pendTxt: 'Extrato não enviado', cert: 'Válido até 10/2027', fechado: false },
    { id: 'rafael', nome: 'Rafael Lima Fotografia', sigla: 'RL', cnpj: '77.777.777/0001-77', regime: 'MEI', cidade: 'Florianópolis', uf: 'SC', ie: 'Isento', cnae: '7420-0/01 · Fotografia', notas: 6, fat: 'R$ 7.800,00', pend: 0, pendTxt: 'Nenhuma', cert: 'Válido até 02/2027', fechado: true },
    { id: 'bompreco', nome: 'Mercado Bom Preço Ltda', sigla: 'BP', cnpj: '88.888.888/0001-88', regime: 'Lucro Presumido', cidade: 'Santos', uf: 'SP', ie: '633.112.233.114', cnae: '4711-3/02 · Supermercado', notas: 412, fat: 'R$ 296.300,00', pend: 3, pendTxt: '3 lançamentos', cert: 'Válido até 06/2027', fechado: false },
    { id: 'valedosol', nome: 'Agropecuária Vale do Sol S.A.', sigla: 'VS', cnpj: '99.999.999/0001-99', regime: 'Lucro Real', cidade: 'Uberlândia', uf: 'MG', ie: '702.334455.00-88', cnae: '0151-2/01 · Criação de bovinos', notas: 87, fat: 'R$ 2.410.000,00', pend: 1, pendTxt: 'NF-e rejeitada', cert: 'Válido até 09/2027', fechado: false }
  ]; }
  empresaId() { if (true) return 'ipe'; if (this.state.__emp) return this.state.__emp; try { return localStorage.getItem('vincula_empresa') || 'ipe'; } catch (e) { return 'ipe'; } }
  empresa() { const id = this.empresaId(); return this.lista().find((x) => x.id === id) || this.lista()[0]; }
  selecionar(id) { try { localStorage.setItem('vincula_empresa', id); } catch (e) {} }
  trocarEmpresa(id) { this.selecionar(id); this.setState({ __emp: id, regime: null }); }
  renderVals() {
    try { localStorage.removeItem('vincula_modo'); } catch (x) {}
    const e = this.empresa();
    const v = this._rv();
    return Object.assign({ ctxVisivel: true, ctx: e, ctxId: e.id, ctxOpcoes: this.lista().map((x) => ({ id: x.id, label: x.nome + ' · ' + x.regime + ' · ' + x.uf })), trocar: (ev) => this.trocarEmpresa(ev.target.value) }, v);
  }

  constructor(p) { super(p); this.state = { passo: 1, emitida: false }; }
  _rv() {
    const n = this.state.passo;
    const nomes = ['1. Orçamento', '2. Pedido', '3. Nota fiscal'];
    const passos = nomes.map((l, i) => ({
      label: l,
      style: 'padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;' + (i + 1 === n ? 'background:#0B2239;color:#fff' : (i + 1 < n ? 'background:#E6F4F1;color:#0A5F52' : 'background:#E9EDF0;color:#5A6B78'))
    }));
    const emp = this.empresa();
    const simples = emp.regime === 'Simples Nacional';
    const mei = emp.regime === 'MEI';
    const ali = emp.uf === 'SC' ? 0.17 : 0.18;
    const fm = (x) => 'R$ ' + x.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const regPill = mei ? 'MEI · CRT 4' : (simples ? 'Simples Nacional · CRT 1' : emp.regime + ' · CRT 3');
    const colCod = (simples || mei) ? 'CSOSN' : 'CST ICMS';
    const colIcms = mei ? 'ICMS' : (simples ? 'Crédito ICMS (1,25%)' : 'ICMS (' + Math.round(ali * 100) + '%)');
    const cod = mei ? '102' : (simples ? '101' : '00');
    const icms1 = mei ? 'Não destaca' : (simples ? 'R$ 21,38' : fm(1710 * ali));
    const icms2 = mei ? 'Não destaca' : (simples ? 'R$ 22,80' : fm(1824 * ali));
    return {
