<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas e notas fiscais · Vincula (protótipo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#F3F6F9;color:#14212B}
a{color:#0E7C6B}a:hover{color:#0A5F52}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#C5D3DD;text-decoration:none;font-size:14px;font-weight:500}
.nav a:hover{background:#13304B;color:#fff}
.nav a.on{background:#0E7C6B;color:#fff}
button{font-family:inherit;cursor:pointer}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3D4D59;font-weight:500}
input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD4DB;border-radius:8px;background:#fff;color:#14212B;min-height:42px;box-sizing:border-box}
th{font-weight:600;font-size:11px;color:#5A6B78;text-align:left;padding:10px 12px;border-bottom:1px solid #E4E9EE;background:#F8FAFB;text-transform:uppercase;letter-spacing:.05em}
td{font-size:14px;padding:12px;border-bottom:1px solid #EEF1F4}
tbody tr:hover{background:#F7FBFA}
h1{letter-spacing:-.02em}
</style>

</head>
<body>
<div style="min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#fff;border-bottom:1px solid #E4E9EE;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 20px;box-sizing:border-box">
    <a href="ClienteVenda.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#0B2239"><span style="width:34px;height:34px;border-radius:9px;background:#0E7C6B;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg></span><span style="font-weight:800;font-size:19px;letter-spacing:-.03em">Vincula</span><span style="font-size:11px;font-weight:700;color:#0A5F52;background:#E6F4F1;border-radius:6px;padding:2px 6px">ERP</span></a>
    <button style="display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:600;color:#14212B;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg><span>Marcenaria Ipê Ltda</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div style="flex:1 1 220px;max-width:460px;display:flex;align-items:center;gap:8px;background:#F3F6F9;border:1px solid #E4E9EE;border-radius:9px;padding:0 12px;min-height:40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input aria-label="Buscar" placeholder="Buscar empresa, nota, cliente, produto…" style="border:0;background:transparent;min-height:38px;padding:0;flex:1;min-width:0;outline:none"></div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button aria-label="Notificações" style="position:relative;width:40px;height:40px;border-radius:9px;border:1px solid #E4E9EE;background:#fff;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span style="position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#D97706"></span></button>
      <div style="display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:50%;background:#0B2239;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center">CM</span><span style="display:flex;flex-direction:column;line-height:1.2"><span style="font-size:13px;font-weight:600">Carlos Mendes</span><span style="font-size:12px;color:#5A6B78">Marcenaria Ipê Ltda</span></span></div>
    </div>
  </header>
<div style="display:flex;flex-wrap:wrap;flex:1">
  <nav class="nav" style="flex:1 1 220px;max-width:248px;background:#0B2239;padding:18px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:3px">
    <div style="font-size:11px;color:#7F97A6;padding:14px 12px 6px;letter-spacing:.08em;font-weight:600">MARCENARIA IPÊ LTDA</div>
    <a class="on" href="ClienteVenda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg><span>Vendas e notas fiscais</span></a>
    <a href="ClienteFinanceiro.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg><span>Financeiro</span></a>
    <a href="ClienteIntegracao.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.6 0l3-3a4 4 0 0 0-5.6-5.6l-1 1"/><path d="M14 10a4 4 0 0 0-5.6 0l-3 3a4 4 0 0 0 5.6 5.6l1-1"/></svg><span>Minha contabilidade</span><span style="margin-left:auto;background:#D97706;color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px">1</span></a>
    <a href="LoginCliente.html" style="margin-top:18px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></a>
  </nav>
  <main id="dc-root" style="flex:999 1 560px;min-width:0;padding:22px 28px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"></main>
</div>
</div>
<template id="dc-tpl">
    <div style="font-size:12px;color:#5A6B78;font-weight:500">Vendas e notas fiscais</div>

    <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
      <div>
        <h1 style="margin:0;font-size:26px">Venda · Orçamento nº 0218</h1>
        <p style="margin:6px 0 0;color:#5A6B78;font-size:14px">Cliente: Carlos Mendes · Pompéu/MG · consumidor final</p>
      </div>
      <button onClick="{{reiniciar}}" style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Reiniciar demonstração</button>
    </div>
    <ol style="list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px">
      <template data-for="passos" data-as="p">
        <li style="{{p.style}}">{{p.label}}</li>
      </template>
    </ol>
    <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:16px">
      <h2 style="margin:0;font-size:17px">Itens</h2>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;min-width:620px">
          <thead><tr><th>Produto</th><th>NCM</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead>
          <tbody>
            <tr><td style="font-weight:600">Mesa de jantar em ipê 1,80 m</td><td>9403.30.00</td><td>1</td><td>R$ 1.800,00</td><td>R$ 1.800,00</td></tr>
            <tr><td style="font-weight:600">Cadeira estofada em ipê</td><td>9401.61.00</td><td>6</td><td>R$ 320,00</td><td>R$ 1.920,00</td></tr>
          </tbody>
        </table>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:24px;justify-content:flex-end;font-size:14px">
        <div>Subtotal <strong>R$ 3.720,00</strong></div>
        <div>Desconto 5% <strong>− R$ 186,00</strong></div>
        <div style="font-size:16px">Total <strong>R$ 3.534,00</strong></div>
      </div>
      <div style="font-size:14px;color:#3D4D59">Pagamento: 50% de entrada + 50% em 30 dias</div>
    </section>
    <template data-if="s1">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <span style="background:#FFF4E5;color:#8A3B08;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600">Orçamento enviado ao cliente</span>
        <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Ver PDF com a logo</button>
        <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Enviar por WhatsApp</button>
        <button onClick="{{aprovar}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Cliente aprovou → gerar pedido</button>
      </section>
    </template>
    <template data-if="s2">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:17px">Pedido de venda nº 1043</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:14px">
          <div><div style="color:#5A6B78;font-size:12px">Natureza de operação</div>Venda de mercadoria · dentro do estado</div>
          <div><div style="color:#5A6B78;font-size:12px">Estoque</div>7 itens reservados no depósito principal</div>
          <div><div style="color:#5A6B78;font-size:12px">Entrega</div>Entrega própria · grátis</div>
        </div>
        <div><button onClick="{{gerarNota}}" style="background:#0E7C6B;color:#fff;border:1px solid #0E7C6B;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Gerar NF-e</button></div>
      </section>
    </template>
    <template data-if="s3">
      <section style="background:#fff;border:1px solid #E4E9EE;border-radius:14px;box-shadow:0 1px 2px rgba(16,35,50,.05),0 6px 20px rgba(16,35,50,.05);padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center">
          <h2 style="margin:0;font-size:17px">Impostos calculados (simulação antes de emitir)</h2>
          <span style="background:#E6F4F1;color:#0A5F52;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600">Simples Nacional · CRT 1</span>
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;min-width:620px">
            <thead><tr><th>Item</th><th>CFOP</th><th>CSOSN</th><th>Crédito ICMS (1,25%)</th><th>Tributos aprox. (IBPT)</th></tr></thead>
            <tbody>
              <tr><td>Mesa de jantar</td><td>5102</td><td>101</td><td>R$ 21,38</td><td>R$ 236,14</td></tr>
              <tr><td>Cadeira estofada (6)</td><td>5102</td><td>101</td><td>R$ 22,80</td><td>R$ 251,55</td></tr>
            </tbody>
          </table>
        </div>
        <p style="margin:0;font-size:13px;color:#5A6B78">CFOP, CSOSN e textos legais vêm da natureza de operação cadastrada pelo escritório. Valores ilustrativos.</p>
        <template data-if="naoEmitida">
          <div><button onClick="{{emitir}}" style="background:#0B2239;color:#fff;border:1px solid #0B2239;border-radius:8px;padding:12px 16px;font-weight:600;font-size:14px;min-height:44px">Emitir NF-e (homologação)</button></div>
        </template>
        <template data-if="emitida">
          <div role="status" style="background:#ECF7F4;border:1px solid #BFE1D9;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px">
            <div style="font-weight:700;color:#0A5F52;font-size:15px">NF-e nº 1043 autorizada pela SEFAZ-MG</div>
            <div style="font-size:13px;color:#3D4D59">Chave 3126 1111 1111 1110 0011 5500 1000 0010 4310 0000 0010 (exemplo)</div>
            <div style="font-size:14px">Contas a receber criadas: <strong>R$ 1.767,00</strong> hoje (entrada) e <strong>R$ 1.767,00</strong> em 27/12/2026. XML enviado à contabilidade e ao cliente.</div>
            <div style="display:flex;flex-wrap:wrap;gap:10px">
              <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Baixar DANFE</button>
              <button style="background:#fff;border:1px solid #CBD4DB;border-radius:8px;padding:10px 14px;font-weight:600;font-size:13px;min-height:44px">Carta de correção</button>
              <a href="ClienteFinanceiro.html" style="background:#0E7C6B;color:#fff;text-decoration:none;border-radius:8px;padding:12px 14px;font-weight:600;font-size:13px">Ver no financeiro →</a>
            </div>
          </div>
        </template>
      </section>
    </template>
  
</template>
<script src="runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { passo: 1, emitida: false }; }
  renderVals() {
    const n = this.state.passo;
    const nomes = ['1. Orçamento', '2. Pedido', '3. Nota fiscal'];
    const passos = nomes.map((l, i) => ({
      label: l,
      style: 'padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;' + (i + 1 === n ? 'background:#0B2239;color:#fff' : (i + 1 < n ? 'background:#E6F4F1;color:#0A5F52' : 'background:#E9EDF0;color:#5A6B78'))
    }));
    return {
      passos,
      s1: n === 1, s2: n === 2, s3: n === 3,
      emitida: this.state.emitida, naoEmitida: !this.state.emitida,
      aprovar: () => this.setState({ passo: 2 }),
      gerarNota: () => this.setState({ passo: 3 }),
      emitir: () => this.setState({ emitida: true }),
      reiniciar: () => this.setState({ passo: 1, emitida: false })
    };
  }
}

DC.start(Component);
</script>
</body>
</html>
